name = "titip-relay"
main = "titip-relay.js"
compatibility_date = "2025-01-01"

# One KV namespace holds the encrypted Autopilot state and orders.
#   npx wrangler kv namespace create RELAY      prints the id to put here
#   npx wrangler deploy
[[kv_namespaces]]
binding = "RELAY"
id = "PUT_YOUR_KV_NAMESPACE_ID_HERE"

# One Durable Object per PC passes mail questions and answers (encrypted) within seconds.
# It needs no id; the free plan allows it.
[[durable_objects.bindings]]
name = "ASKS"
class_name = "Asks"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["Asks"]
